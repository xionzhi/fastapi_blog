<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Loading checks</title>
  </head>
  <body>
    <h1>Running loading checks…</h1>
    <ol id="results"></ol>
    <div id="app"></div>
    <script type="module">
      import { createApp, h } from 'vue'
      import { createMemoryHistory, createRouter } from 'vue-router'
      import App from '../src/App.vue'
      import HomeView from '../src/views/HomeView.vue'
      import { initialDocument } from '../src/stores/initial'
      import { site } from '../src/stores/site'
      const originalFetch = window.fetch
      const requests = []
      let app
      const assert = (ok, message) => {
        if (!ok) throw new Error(message)
        const item = document.createElement('li')
        item.textContent = `PASS: ${message}`
        document.querySelector('#results').append(item)
      }
      const until = async (predicate) => {
        const start = performance.now()
        while (!predicate()) {
          if (performance.now() - start > 5000) throw new Error('Timed out waiting for UI')
          await new Promise((resolve) => setTimeout(resolve, 20))
        }
      }
      const post = {
        id: 'one',
        title: 'First story',
        slug: 'one',
        excerpt: 'Story excerpt',
        tags: [{ id: 'tag', name: 'Readable Tag', slug: 'readable-tag' }],
        author: 'writer',
        author_slug: 'writer',
        published_at: '2026-01-01T00:00:00Z',
        reading_time: 1,
        status: 'published',
        type: 'post',
        feature_image: '',
      }
      const page = { items: [post], page: 1, limit: 5, pages: 1, total: 1 }
      try {
        site.value = { ...site.value, cover: '', logo: '', author_image: '' }
        initialDocument.path = '/'
        initialDocument.posts = page
        window.fetch = async (url) => {
          requests.push(String(url))
          return new Response(JSON.stringify(page), { status: 200 })
        }
        const router = createRouter({
          history: createMemoryHistory(),
          routes: [
            { path: '/', component: HomeView },
            { path: '/tag/:tag', component: HomeView },
          ],
        })
        await router.push('/')
        app = createApp({ render: () => h(App) }).use(router)
        app.mount('#app')
        await until(() => document.querySelector('.list-post'))
        assert(
          requests.length === 0,
          'Initial home uses seeded posts without requesting tags or posts again',
        )
        assert(
          !performance
            .getEntriesByType('resource')
            .some((entry) => entry.name.includes('/components/SearchDialog.vue')),
          'Search implementation is not loaded for the initial page',
        )
        await router.push('/tag/readable-tag')
        await until(() => document.querySelector('.page-title')?.textContent === 'Readable Tag')
        assert(
          !requests.some((url) => url === '/api/tags'),
          'Tag headings come from the posts rather than a second tag-list request',
        )
        const trigger = document.querySelector('.list-tools .text-button')
        trigger.focus()
        trigger.click()
        await until(() => document.querySelector('.search-field input'))
        assert(
          performance
            .getEntriesByType('resource')
            .some((entry) => entry.name.includes('/components/SearchDialog.vue')),
          'Search code loads when the user opens search',
        )
        assert(
          document.activeElement === document.querySelector('.search-field input'),
          'Loaded search receives keyboard focus',
        )
        document.querySelector('.search-field input').value = 'story'
        document
          .querySelector('.search-field input')
          .dispatchEvent(new Event('input', { bubbles: true }))
        await until(() => document.querySelector('.search-results h3'))
        assert(
          requests.some((url) => url.includes('/api/posts?') && url.includes('q=story')),
          'Deferred search still requests and displays matching posts',
        )
        document.querySelector('[aria-label="Close search"]').click()
        await until(() => !document.querySelector('.search-dialog'))
        assert(
          document.activeElement === trigger,
          'Closing search restores the original trigger focus',
        )
        document.querySelector('h1').textContent = 'All loading checks passed'
      } catch (error) {
        document.querySelector('h1').textContent = 'Loading checks failed'
        const item = document.createElement('li')
        item.textContent = `FAIL: ${error.stack || error.message}`
        document.querySelector('#results').append(item)
      } finally {
        app?.unmount()
        window.fetch = originalFetch
      }
    </script>
  </body>
</html>
