<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Presentation checks</title>
  </head>
  <body>
    <h1>Running presentation checks…</h1>
    <ol id="results"></ol>
    <main id="main-content">
      <div class="list-tools">
        <span>
          Latest posts
          <small>/ 40</small>
        </span>
        <button class="text-button">Search posts</button>
      </div>
      <article class="post">
        <h2>Readable secondary text</h2>
        <div class="post-meta article-meta">
          <a href="#">Author</a>
          <span class="meta-tags">
            on
            <a href="#">Tag</a>
          </span>
          <time class="post-date">17 NOVEMBER 2026</time>
        </div>
      </article>
      <nav class="pagination blog-pagination">
        <span class="page-number">Page 1 of 4</span>
        <a
          class="older-posts"
          href="#"
        >
          Older Posts
        </a>
      </nav>
    </main>
    <footer class="blog-footer">
      <a href="#">Blog</a>
      <span>© 2026</span>
    </footer>
    <script type="module">
      import '../src/styles/casper.css'
      import '../src/styles/fonts.css'
      import '../src/style.css'
      import { updatePageMetadata } from '../src/utils/metadata'
      const assert = (ok, message) => {
        if (!ok) throw new Error(message)
        const row = document.createElement('li')
        row.textContent = `PASS: ${message}`
        document.querySelector('#results').append(row)
      }
      function luminance(color) {
        const channels = color
          .match(/[\d.]+/g)
          .slice(0, 3)
          .map(Number)
          .map((v) => {
            v /= 255
            return v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4
          })
        return channels[0] * 0.2126 + channels[1] * 0.7152 + channels[2] * 0.0722
      }
      try {
        for (const selector of [
          '.list-tools span',
          '.list-tools small',
          '.text-button',
          '.article-meta a',
          '.post-date',
          '.meta-tags',
          '.page-number',
          '.older-posts',
          '.blog-footer',
        ]) {
          const color = getComputedStyle(document.querySelector(selector)).color
          const ratio = 1.05 / (luminance(color) + 0.05)
          assert(ratio >= 4.5, `${selector}: contrast ${ratio.toFixed(2)}:1 against white`)
        }
        const fonts = await document.fonts.load('12px "Open Sans"')
        assert(
          fonts.length > 0,
          'Self-hosted fonts load after moving their CSS into the asset pipeline',
        )
        const site = { title: 'Blog', author: 'Writer', description: ' ', cover: '' }
        updatePageMetadata('/', site)
        assert(
          document.querySelector('meta[name="description"]').content ===
            'Posts and notes by Writer on Blog.',
          'Empty site descriptions retain meaningful fallback metadata',
        )
        updatePageMetadata('/article/', site, { description: 'Article excerpt' })
        assert(
          document.querySelector('meta[name="description"]').content === 'Article excerpt',
          'Article descriptions still override the site fallback',
        )
        document.querySelector('h1').textContent = 'All presentation checks passed'
      } catch (error) {
        document.querySelector('h1').textContent = 'Presentation checks failed'
        const row = document.createElement('li')
        row.textContent = `FAIL: ${error.message}`
        document.querySelector('#results').append(row)
      }
    </script>
  </body>
</html>
