<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Review regression checks</title>
  </head>
  <body>
    <h1>Running review regression checks…</h1>
    <ol id="results"></ol>
    <div id="app"></div>
    <script type="module">
      import { createApp, h, nextTick, ref } from 'vue'
      import { createMemoryHistory, createRouter, RouterView } from 'vue-router'
      import { usePostEditor } from '../src/composables/usePostEditor'
      import { useModalFocus } from '../src/composables/useModalFocus'
      import { initialDocument, takeInitialPost } from '../src/stores/initial'
      import { updatePageMetadata } from '../src/utils/metadata'
      import { site, loadSite } from '../src/stores/site'
      import PostView from '../src/views/PostView.vue'

      const results = document.querySelector('#results')
      const assert = (ok, message) => {
        if (!ok) throw new Error(message)
        const row = document.createElement('li')
        row.textContent = `PASS: ${message}`
        results.append(row)
      }
      const settle = async () => {
        for (let i = 0; i < 8; i++) await new Promise((resolve) => setTimeout(resolve, 0))
        await nextTick()
      }
      const deferred = () => {
        let resolve
        const promise = new Promise((done) => {
          resolve = done
        })
        return { promise, resolve }
      }
      const post = (id) => ({
        id,
        title: `Post ${id}`,
        slug: id,
        body: `Body ${id}`,
        format: 'markdown',
        html: '<h2 id="heading">Heading</h2><p>Readable article</p>',
        excerpt: `Excerpt ${id}`,
        status: 'draft',
        type: 'post',
        feature_image: '',
        author: 'writer',
        author_slug: 'writer',
        tags: [],
        published_at: null,
        created_at: '2026-01-01T00:00:00Z',
        updated_at: '2026-01-01T00:00:00Z',
        version: 1,
        reading_time: 1,
        related: [],
      })
      const json = (value, status = 200) => new Response(JSON.stringify(value), { status })
      const originalFetch = window.fetch
      const originalConfirm = window.confirm
      let application
      try {
        window.confirm = () => true
        let writes = 0
        let readFailure = false
        let pendingSave
        let pendingRead
        const requests = []
        window.fetch = async (url, options = {}) => {
          requests.push(String(url))
          if (String(url) === '/api/admin/tags') return json([])
          if (String(url) === '/api/admin/site')
            return json({ ...site.value, title: 'Fresh import' })
          if (String(url) === '/api/site')
            return json({ ...site.value, title: 'Stale public cache' })
          if (['POST', 'PUT'].includes(options.method)) {
            writes++
            return pendingSave.promise
          }
          if (pendingRead) return pendingRead.promise
          return readFailure
            ? json({ detail: 'Unavailable' }, 500)
            : json(post(String(url).split('/').pop()))
        }
        let editor
        const Editor = {
          setup() {
            editor = usePostEditor(ref())
            return () => h('p', 'Editor harness')
          },
        }
        const router = createRouter({
          history: createMemoryHistory(),
          routes: [
            { path: '/workspace/posts/new', component: Editor },
            { path: '/workspace/posts/:id', component: Editor },
            { path: '/outside', component: { render: () => h('p', 'Outside') } },
          ],
        })
        await router.push('/workspace/posts/a')
        application = createApp({ render: () => h(RouterView) }).use(router)
        application.mount('#app')
        await settle()
        assert(editor.ready.value && editor.id.value === 'a', 'Editor loads the requested article')
        pendingSave = deferred()
        editor.model.value.title = 'Edited A'
        const saving = editor.save()
        await router.push('/workspace/posts/new')
        assert(
          router.currentRoute.value.params.id === 'a',
          'Pending saves block navigation to another draft',
        )
        editor.model.value.body = 'Newer unsaved content'
        pendingSave.resolve(json({ ...post('a'), title: 'Edited A', version: 2 }))
        await saving
        assert(
          editor.model.value.body === 'Newer unsaved content' && editor.dirty.value,
          'Saving preserves edits made while the request was pending',
        )

        await router.push('/workspace/posts/new')
        await settle()
        assert(
          editor.ready.value && !editor.id.value,
          'New drafts start without the previous article identity',
        )
        editor.model.value.title = 'New article'
        pendingSave = deferred()
        const creating = editor.save()
        pendingSave.resolve(json(post('created')))
        await creating
        assert(
          router.currentRoute.value.params.id === 'created' && editor.id.value === 'created',
          'Successful creation opens the saved article without blocking its own navigation',
        )

        readFailure = true
        await router.push('/workspace/posts/b')
        await settle()
        assert(
          !editor.ready.value && !editor.id.value,
          'Failed article loads discard the previous article identity',
        )
        await editor.save()
        assert(writes === 2, 'Save shortcuts cannot write after a failed load')
        readFailure = false
        await editor.load()
        assert(
          editor.ready.value && editor.id.value === 'b',
          'Retry restores the requested article',
        )
        pendingRead = deferred()
        await router.push('/workspace/posts/c')
        await settle()
        await editor.save()
        assert(editor.loading.value && writes === 2, 'Save shortcuts cannot write while loading')
        pendingRead.resolve(json(post('c')))
        await settle()
        pendingRead = undefined

        pendingSave = deferred()
        const oldEditor = editor
        const lateSave = editor.save()
        application.unmount()
        application = undefined
        pendingSave.resolve(json({ ...post('wrong-id'), version: 99 }))
        await lateSave
        assert(
          oldEditor.id.value === 'c' && oldEditor.model.value.version === 1,
          'Disposed editors ignore late save responses',
        )

        await loadSite(true)
        assert(
          site.value.title === 'Fresh import' && requests.at(-1) === '/api/admin/site',
          'Imported settings refresh through the uncached administrator endpoint',
        )

        initialDocument.path = '/seed'
        initialDocument.post = post('seed')
        assert(
          takeInitialPost('/other') === undefined,
          'Article seeds cannot leak into another route',
        )
        const publicRouter = createRouter({
          history: createMemoryHistory(),
          routes: [{ path: '/:slug', component: PostView }],
        })
        await publicRouter.push('/seed')
        const beforeSeed = requests.length
        application = createApp({ render: () => h(RouterView) }).use(publicRouter)
        application.mount('#app')
        await settle()
        assert(
          document.querySelector('.article-body')?.textContent.includes('Readable article'),
          'Article content survives Vue mounting from initial data',
        )
        assert(
          requests.length === beforeSeed,
          'Seeded articles do not make a duplicate detail request',
        )
        assert(takeInitialPost('/seed/') === undefined, 'Article seeds are consumed once')
        await publicRouter.push('/next')
        await settle()
        assert(
          document.title === `Post next · ${site.value.title}`,
          'Article navigation updates the document title',
        )
        assert(
          document.querySelector('meta[property="og:title"]').content === document.title,
          'Article navigation updates Open Graph metadata',
        )
        assert(
          new URL(document.querySelector('link[rel="canonical"]').href).pathname === '/next/',
          'Article navigation updates the canonical URL',
        )
        assert(
          document.querySelector('meta[name="description"]').content === 'Excerpt next',
          'Article navigation replaces the previous description',
        )
        application.unmount()
        application = undefined
        updatePageMetadata('/', site.value)
        assert(
          document.querySelector('meta[property="og:type"]').content === 'website',
          'Returning home clears article metadata',
        )

        const trigger = document.createElement('button')
        trigger.textContent = 'Open modal'
        document.querySelector('#app').append(trigger)
        trigger.focus()
        const modal = document.createElement('section')
        modal.tabIndex = -1
        modal.innerHTML = '<button>Close</button><input aria-label="Name"><button>Save</button>'
        document.body.append(modal)
        const { effectScope } = await import('vue')
        const scope = effectScope()
        const active = ref(false)
        let keyboard
        scope.run(() => {
          ;({ keyboard } = useModalFocus(active, ref(modal), () => {
            active.value = false
          }))
        })
        active.value = true
        await settle()
        assert(
          document.querySelector('#app').inert &&
            document.activeElement === modal.querySelector('input'),
          'Modal isolates the background and focuses the first input',
        )
        modal.lastElementChild.focus()
        keyboard(new KeyboardEvent('keydown', { key: 'Tab', cancelable: true }))
        assert(document.activeElement === modal.firstElementChild, 'Tab wraps inside the modal')
        keyboard(new KeyboardEvent('keydown', { key: 'Tab', shiftKey: true, cancelable: true }))
        assert(
          document.activeElement === modal.lastElementChild,
          'Shift Tab wraps inside the modal',
        )
        keyboard(new KeyboardEvent('keydown', { key: 'Escape', cancelable: true }))
        await settle()
        assert(
          !document.querySelector('#app').inert && document.activeElement === trigger,
          'Escape closes the modal and restores focus',
        )
        scope.stop()
        modal.remove()
        document.querySelector('h1').textContent = 'All review regression checks passed'
      } catch (error) {
        document.querySelector('h1').textContent = 'Review regression checks failed'
        const row = document.createElement('li')
        row.textContent = `FAIL: ${error.stack || error.message}`
        results.append(row)
      } finally {
        application?.unmount()
        window.fetch = originalFetch
        window.confirm = originalConfirm
      }
    </script>
  </body>
</html>
